<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESG Platform</title>
    <style>
        :root {
            --bg: #f5f7f3;
            --panel: #ffffff;
            --ink: #182118;
            --muted: #62705f;
            --line: #d9e1d4;
            --accent: #2f6f4e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(47, 111, 78, 0.12), transparent 44%),
                linear-gradient(315deg, rgba(100, 121, 75, 0.14), transparent 42%),
                var(--bg);
        }

        main {
            width: min(100%, 560px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 36px;
            box-shadow: 0 24px 70px rgba(25, 35, 26, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
            line-height: 1.15;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a.secondary {
            background: #fff;
            color: var(--accent);
        }

        @media (max-width: 560px) {
            main {
                padding: 28px;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>ESG Reporting Platform</h1>
        <p>Select the login area for your account.</p>

        <div class="actions">
            <a href="{% url 'platform-login' %}">Platform Admin</a>
            <a class="secondary" href="{% url 'company-login' %}">Company User</a>
        </div>
    </main>
</body>
</html>
