<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Company Login</title>
    <style>
        :root {
            --bg: #f4f7f2;
            --panel: #ffffff;
            --ink: #19231a;
            --muted: #667061;
            --line: #d9e1d4;
            --accent: #2f6f4e;
            --accent-dark: #24583d;
            --danger-bg: #fff0ed;
            --danger: #9d2d1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(47, 111, 78, 0.12), transparent 42%),
                linear-gradient(315deg, rgba(111, 128, 83, 0.16), transparent 40%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 24px 70px rgba(25, 35, 26, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.15;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
            margin-bottom: 18px;
            color: var(--ink);
            font: inherit;
        }

        input:focus {
            border-color: var(--accent);
            outline: 3px solid rgba(47, 111, 78, 0.16);
        }

        button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Company Login</h1>
        <p>Use your company account credentials.</p>

        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="post" action="{% url 'company-login' %}">
            {% csrf_token %}

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
