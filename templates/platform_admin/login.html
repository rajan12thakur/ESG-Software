<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Platform Admin Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f5f7f3;
            color: #19231a;
        }

        main {
            width: min(100%, 420px);
            background: #fff;
            border: 1px solid #d9e1d4;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 24px 70px rgba(25, 35, 26, 0.12);
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            margin: 0 0 24px;
            color: #657061;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 700;
        }

        input,
        button {
            width: 100%;
            min-height: 42px;
            border-radius: 6px;
            font: inherit;
        }

        input {
            border: 1px solid #d9e1d4;
            padding: 0 10px;
        }

        button {
            margin-top: 18px;
            border: 0;
            background: #2f6f4e;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            background: #fff0ed;
            color: #9d2d1c;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Platform Admin</h1>
        <p>Use your Django staff or superuser account.</p>

        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form method="post" action="{% url 'platform-login' %}">
            {% csrf_token %}
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
