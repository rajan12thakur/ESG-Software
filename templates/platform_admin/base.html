<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Platform Admin{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f7f3;
            --panel: #ffffff;
            --ink: #19231a;
            --muted: #657061;
            --line: #d9e1d4;
            --accent: #2f6f4e;
            --danger: #9d2d1c;
            --sidebar: #1d2a21;
            --sidebar-soft: #243329;
            --sidebar-text: #edf2ee;
            --sidebar-muted: #b4c0b6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        .layout {
            width: min(1400px, calc(100% - 32px));
            margin: 0 auto;
            padding: 16px 0 28px;
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 16px;
            min-height: calc(100vh - 32px);
            border-radius: 18px;
            padding: 20px;
            background: linear-gradient(180deg, var(--sidebar), #152018);
            color: var(--sidebar-text);
            box-shadow: 0 20px 45px rgba(13, 20, 15, .14);
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
        }

        .sidebar__brand {
            display: grid;
            gap: 4px;
        }

        .sidebar__eyebrow {
            color: var(--sidebar-muted);
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .sidebar__title {
            font-size: 18px;
            line-height: 1.2;
        }

        .sidebar__nav {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .sidebar__link,
        .sidebar__footer button {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 42px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--sidebar-text);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .sidebar__link:hover,
        .sidebar__footer button:hover {
            background: var(--sidebar-soft);
        }

        .sidebar__link.is-active {
            background: rgba(237, 242, 238, .12);
            border-color: rgba(237, 242, 238, .12);
        }

        .sidebar__logout {
            width: 100%;
            border-color: rgba(237, 242, 238, .18);
            box-shadow: inset 0 0 0 1px rgba(237, 242, 238, .08);
        }

        .sidebar__footer {
            display: grid;
            gap: 12px;
            align-content: end;
        }

        main {
            width: auto;
            margin: 0;
            padding: 0;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
        }

        .label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            font-size: 22px;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px;
            font: inherit;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 700;
        }

        button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            padding: 0 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .secondary {
            background: #fff;
            color: var(--accent);
        }

        .danger {
            border-color: var(--danger);
            background: var(--danger);
        }

        .messages {
            margin-bottom: 16px;
        }

        .message {
            background: #eef7ef;
            border: 1px solid #cce2ce;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        form.inline {
            display: inline;
        }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                min-height: auto;
            }
        }

        @media (max-width: 780px) {
            .layout {
                width: calc(100% - 20px);
                padding-top: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        {% with sidebar_variant="platform" %}
            {% include "sidebar/sidebar.html" %}
        {% endwith %}

    <main>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
