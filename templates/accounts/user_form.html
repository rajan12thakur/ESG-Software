{% extends "accounts/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form class="panel" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="{% url 'account-user-list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
