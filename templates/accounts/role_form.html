{% extends "accounts/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form class="panel" method="post">{% csrf_token %}
{{ form.non_field_errors }}
{{ form.name.errors }}<label for="{{ form.name.id_for_label }}">Role name</label>{{ form.name }}
{{ form.description.errors }}<label for="{{ form.description.id_for_label }}">Description</label>{{ form.description }}
<label style="display:flex; gap:8px; align-items:center;">{{ form.is_active }} Active</label>
<div class="actions"><button type="submit">Save</button><a class="button secondary" href="{% url 'account-role-list' %}">Cancel</a></div></form>
{% endblock %}
